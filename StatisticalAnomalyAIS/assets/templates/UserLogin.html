{% extends 'base.html' %}
{% load static %}

{% block contents %}

<section class="flex items-center justify-center min-h-[80vh]">

    <!-- 🔥 LOGIN CARD -->
    <div class="bg-gray-800/80 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-full max-w-md transition hover:shadow-indigo-500/20">

        <!-- 🔥 TITLE -->
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-indigo-400 flex justify-center items-center gap-2">
                <i class="fa fa-user"></i>
                User Login
            </h2>
            <p class="text-gray-400 text-sm mt-2">
                Access AIS Analysis Dashboard
            </p>
        </div>

        <!-- 🔥 FORM -->
        <form action="{% url 'UserLoginCheck' %}" method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- LOGIN ID -->
            <div>
                <label class="text-gray-400 text-sm">Login ID</label>
                <input type="text" name="loginid" required
                    placeholder="Enter Login ID"
                    class="w-full mt-1 px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"/>
            </div>

            <!-- PASSWORD -->
            <div>
                <label class="text-gray-400 text-sm">Password</label>
                <input type="password" name="pswd" required
                    placeholder="Enter Password"
                    class="w-full mt-1 px-4 py-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"/>
            </div>

            <!-- BUTTONS -->
            <div class="flex gap-4 mt-4">
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 py-2 rounded-lg text-white font-semibold transition transform hover:scale-105">
                    Login
                </button>

                <button type="reset"
                    class="w-full bg-gray-600 hover:bg-gray-700 py-2 rounded-lg text-white font-semibold transition transform hover:scale-105">
                    Reset
                </button>
            </div>

            <!-- 🔥 EXTRA OPTIONS -->
            <div class="flex justify-between text-sm text-gray-400 mt-3">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="accent-indigo-500"> Remember me
                </label>
                <a href="#" class="hover:text-indigo-400">Forgot password?</a>
            </div>

            <!-- 🔥 MESSAGES -->
            {% if messages %}
            <div class="mt-4 text-center">
                {% for message in messages %}
                <div class="bg-green-500/10 text-green-400 border border-green-500/20 px-4 py-2 rounded-lg text-sm">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

        </form>

    </div>

</section>

{% endblock %}
